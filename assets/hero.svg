<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="I Gusti Ngurah Bagus Lanang P. — Backend architect and data analytics specialist">
<defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b4b4ba"/>
    </linearGradient>
    <radialGradient id="a1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="a2"><stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#bf5af2" stop-opacity="0"/></radialGradient>
    <radialGradient id="a3"><stop offset="0" stop-color="#ff375f"/><stop offset="1" stop-color="#ff375f" stop-opacity="0"/></radialGradient>
    <radialGradient id="a4"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.92"/><stop offset="0.5" stop-color="#000" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="clip"><rect width="1000" height="360" rx="30"/></clipPath>
    </defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;}</style>

    <g clip-path="url(#clip)">
      <rect width="1000" height="360" fill="#000000"/>
      <g filter="url(#soft)" opacity="0.95">
        <circle cx="790" cy="70"  r="150" fill="url(#a1)"/>
        <circle cx="930" cy="250" r="170" fill="url(#a2)"/>
        <circle cx="690" cy="330" r="120" fill="url(#a3)"/>
        <circle cx="980" cy="60"  r="90"  fill="url(#a4)"/>
      </g>
      <rect width="1000" height="360" fill="url(#fade)"/>
    </g>
    <rect x="0.5" y="0.5" width="999" height="359" rx="29.5" fill="none" stroke="#2c2c2e"/>
    <text x="56" y="132" font-size="60" font-weight="700" letter-spacing="-1.8" fill="url(#ink)">I Gusti Ngurah</text>
    <text x="56" y="200" font-size="60" font-weight="700" letter-spacing="-1.8" fill="url(#ink)">Bagus Lanang P.</text>
    <text x="56" y="252" font-size="22" font-weight="400" fill="#a1a1a6">Backend architect and data analytics specialist.</text>
    <rect x="56" y="296" width="187" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/><text x="149.5" y="318" text-anchor="middle" font-size="14" font-weight="500" fill="#f5f5f7">Cum Laude, GPA 3.88</text><rect x="253" y="296" width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/><text x="298.0" y="318" text-anchor="middle" font-size="14" font-weight="500" fill="#f5f5f7">Backend</text><rect x="353" y="296" width="131" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/><text x="418.5" y="318" text-anchor="middle" font-size="14" font-weight="500" fill="#f5f5f7">Spatial data</text><rect x="494" y="296" width="123" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/><text x="555.5" y="318" text-anchor="middle" font-size="14" font-weight="500" fill="#f5f5f7">GA4 and SEO</text>
    
</svg>
