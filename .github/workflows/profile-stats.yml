name: Update profile stats

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/generate_stats.py"]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards
        run: python scripts/generate_stats.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a PAT as secret GH_PAT (scope: read:user) to include private repos and contributions.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contributions.svg assets/languages.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
